name: Apply offline empty response fix

on:
  push:
    branches:
      - fix/offline-empty-response

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/offline-empty-response
          fetch-depth: 0
          persist-credentials: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Apply fix
        run: python3 .github/scripts/patch_offline_empty.py

      - name: Install dependencies
        run: flutter pub get

      - name: Run focused regression tests
        run: |
          flutter test test/offline_context_isolation_test.dart
          flutter test test/offline_prompt_and_tokens_test.dart

      - name: Analyze touched Dart files
        run: |
          dart analyze lib/chat/services/response.dart
          dart analyze lib/chat/services/offline.dart
          dart analyze lib/chat/services/send.dart
          dart analyze lib/chat/screen/widgets/tiles.dart

      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/chat/services/response.dart \
            lib/chat/services/offline.dart \
            lib/chat/services/send.dart \
            lib/chat/screen/widgets/tiles.dart \
            test/offline_context_isolation_test.dart
          git commit -m "fix: prevent blank offline assistant responses"
          git push origin HEAD:fix/offline-empty-response
