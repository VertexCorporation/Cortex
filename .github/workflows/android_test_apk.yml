name: Android test APK
on:
  push:
    branches: [feat/voice-offline-music, ccr-23570192-6fqvsp]
    paths: ['pubspec.yaml', 'lib/**', 'assets/**', 'android/**', '.github/workflows/android_test_apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Read app version from pubspec
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version: *\([0-9.]*\)+\([0-9]*\).*/\1 \2/p' pubspec.yaml)"
          read -r name code <<< "$version"
          [[ -n "$name" && -n "$code" ]] || { echo 'pubspec version missing' >&2; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Select signing configuration
        id: signing
        env:
          CORTEX_JKS_BASE64: ${{ secrets.CORTEX_JKS }}
          KEY_PASS: ${{ secrets.JKS_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$CORTEX_JKS_BASE64" && -n "$KEY_PASS" ]]; then
            printf '%s' "$CORTEX_JKS_BASE64" | base64 --decode > android/app/Cortex.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=ai\nstoreFile=Cortex.jks\n' "$KEY_PASS" "$KEY_PASS" > android/key.properties
            echo 'mode=release' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=debug' >> "$GITHUB_OUTPUT"
          fi
      - name: Build arm64 test APK
        env:
          BUILD_MODE: ${{ steps.signing.outputs.mode }}
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.code }}
        run: flutter build apk --$BUILD_MODE --target-platform android-arm64 --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
      - name: Verify APK version and signature
        env:
          BUILD_MODE: ${{ steps.signing.outputs.mode }}
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          apk="apk-output/Cortex-$BUILD_NAME-$BUILD_NUMBER.apk"
          mkdir -p apk-output
          cp "build/app/outputs/flutter-apk/app-${BUILD_MODE}.apk" "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > apk-output/build-info.txt
          python3 - <<'PY'
          import os
          from pathlib import Path
          info = Path('apk-output/build-info.txt').read_text().splitlines()[0]
          assert "name='com.vertex.cortex'" in info, info
          assert f"versionCode='{os.environ['BUILD_NUMBER']}'" in info, info
          assert f"versionName='{os.environ['BUILD_NAME']}'" in info, info
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          printf 'Build mode: %s\nSource commit: %s\n' "$BUILD_MODE" "$GITHUB_SHA" >> apk-output/build-info.txt
          sha256sum "$apk" > apk-output/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cortex-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}-APK
          path: apk-output/
          if-no-files-found: error
          retention-days: 14
