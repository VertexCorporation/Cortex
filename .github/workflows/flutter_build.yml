name: Flutter Build & Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout Code (including llama.cpp)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 21 (matches Gradle toolchains)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Prepare diagnostic directory
        run: mkdir -p build-logs

      - name: Flutter SDK information
        shell: bash
        run: |
          set -o pipefail
          flutter --version 2>&1 | tee build-logs/android-flutter-version.log
          java -version 2>&1 | tee build-logs/android-java-version.log

      - name: Install dependencies and generate localizations
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee build-logs/android-pub-get.log
          flutter gen-l10n 2>&1 | tee build-logs/android-gen-l10n.log

      - name: Verify native llama.cpp source is checked out
        shell: bash
        run: |
          test -f vendor/llama.cpp/CMakeLists.txt || { echo 'ERROR: vendor/llama.cpp missing. Check submodule checkout.'; exit 1; }
          test -f android/llama/src/main/cpp/CMakeLists.txt || { echo 'ERROR: Android llama CMakeLists.txt missing.'; exit 1; }

      - name: Configure Android signing or select debug build
        id: signing
        shell: bash
        env:
          CORTEX_JKS_BASE64: ${{ secrets.CORTEX_JKS }}
          JKS_PASSWORD: ${{ secrets.JKS_PASSWORD }}
        run: bash scripts/ci/configure_android_signing.sh

      - name: Build signed release APK
        if: steps.signing.outputs.release_ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build-logs/android-release-apk.log

      - name: Build signed release AAB
        if: steps.signing.outputs.release_ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          flutter build appbundle --release 2>&1 | tee build-logs/android-release-aab.log

      - name: Build debug APK (signing secrets absent)
        if: steps.signing.outputs.release_ready == 'false'
        shell: bash
        run: |
          set -o pipefail
          echo 'No Android release signing secrets. Producing a debug APK, NOT a Play Store release.' | tee build-logs/android-signing-status.log
          flutter build apk --debug --target-platform android-arm64 2>&1 | tee build-logs/android-debug-apk.log

      - name: Upload Android release files
        if: steps.signing.outputs.release_ready == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          if-no-files-found: error
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Upload Android debug APK
        if: steps.signing.outputs.release_ready == 'false' && success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-NOT-FOR-STORE
          if-no-files-found: error
          retention-days: 14
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Android build logs (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 14

  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest
    timeout-minutes: 110
    steps:
      - name: Checkout Code (including llama.cpp)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Prepare diagnostic directory
        run: mkdir -p build-logs

      - name: Flutter and Xcode information
        shell: bash
        run: |
          set -o pipefail
          flutter --version 2>&1 | tee build-logs/ios-flutter-version.log
          xcodebuild -version 2>&1 | tee build-logs/ios-xcode-version.log

      - name: Install dependencies and CocoaPods (preserve lockfile)
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee build-logs/ios-pub-get.log
          flutter gen-l10n 2>&1 | tee build-logs/ios-gen-l10n.log
          (cd ios && pod install --repo-update) 2>&1 | tee build-logs/ios-pod-install.log

      - name: Check iOS signing credentials
        id: signing
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash scripts/ci/check_ios_signing.sh

      - name: Install Apple signing assets and generate ExportOptions.plist
        if: steps.signing.outputs.release_ready == 'true'
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash scripts/ci/install_ios_signing.sh

      - name: Build signed IPA (App Store Connect)
        if: steps.signing.outputs.release_ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist 2>&1 | tee build-logs/ios-release-ipa.log

      - name: Build unsigned iOS app (signing secrets absent)
        if: steps.signing.outputs.release_ready == 'false'
        shell: bash
        run: |
          set -o pipefail
          echo 'No Apple signing secrets. Compiling unsigned iOS .app; no distributable IPA can be created.' | tee build-logs/ios-signing-status.log
          flutter build ios --release --no-codesign 2>&1 | tee build-logs/ios-unsigned-app.log

      - name: Upload signed IPA
        if: steps.signing.outputs.release_ready == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-artifacts
          if-no-files-found: error
          retention-days: 14
          path: build/ios/ipa/*.ipa

      - name: Upload unsigned iOS app (NOT an IPA)
        if: steps.signing.outputs.release_ready == 'false' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app-NOT-FOR-DISTRIBUTION
          if-no-files-found: error
          retention-days: 14
          path: build/ios/iphoneos/Runner.app/

      - name: Upload iOS build logs (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary Apple signing keychain and secrets
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/cortex-build-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/cortex-build-signing.keychain-db" || true
          fi
          rm -f "$RUNNER_TEMP/cortex-build-certificate.p12" \
                "$RUNNER_TEMP/cortex-build-profile.mobileprovision" \
                "$RUNNER_TEMP/cortex-build-profile.plist"
